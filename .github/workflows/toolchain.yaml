name: Build toolchains

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/toolchain.yaml
  push:
    paths:
      - .devcontainer/**
      - .github/workflows/toolchain.yaml
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  toolbox:
    name: Generate container images

    runs-on: ${{ matrix.arch == 'arm64' && (vars.RUNNER_ARM64 || 'ubuntu-26.04-arm') || 'ubuntu-26.04' }}

    strategy:
      matrix:
        image:
          - m32c-build
          - rl78-build
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract build args from devcontainer config
        id: args
        run: |
          {
            echo "args<<EOF"
            jq -r '.build.args | to_entries | map(.key + "=" + (.value | tostring)) | join("\n")' \
              ".devcontainer/${{ matrix.image }}/devcontainer.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sa8x8-fw-${{ matrix.image }}-${{ matrix.arch }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Containerfile
          platforms: ${{ matrix.arch == 'arm64' && 'linux/arm64/v8' || 'linux/amd64' }}
          provenance: true
          build-args: ${{ steps.args.outputs.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    name: Combine architecture manifests
    needs: toolbox
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        image:
          - m32c-build
          - rl78-build

    steps:
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sa8x8-fw-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push combined manifest
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            base="${tag%:*}"
            ref="${tag##*:}"
            amd64_digest=$(skopeo inspect --raw docker://"${base}-amd64:${ref}" \
              | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')
            arm64_digest=$(skopeo inspect --raw docker://"${base}-arm64:${ref}" \
              | jq -r '.manifests[] | select(.platform.architecture == "arm64") | .digest')
            docker manifest create "${base}:${ref}" \
              "${base}-amd64@${amd64_digest}" "${base}-arm64@${arm64_digest}"
            docker manifest annotate "${base}:${ref}" "${base}-amd64@${amd64_digest}" \
              --os linux --arch amd64
            docker manifest annotate "${base}:${ref}" "${base}-arm64@${arm64_digest}" \
              --os linux --arch arm64 --variant v8
            docker manifest push "${base}:${ref}"
          done

