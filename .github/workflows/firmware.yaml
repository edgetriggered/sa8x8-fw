name: Build firmware

on:
  push:
    paths:
      - src/**
      - Makefile
      - .github/workflows/firmware.yaml
  pull_request:
    paths:
      - src/**
      - Makefile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIF: https://github.com/OpenRTX/sa8x8-fw/releases/download/v1.0.0/rl78-elf-toolchain.sif
  TARGETS: sa818s_vhf sa818s_uhf sa868s_vhf sa868s_uhf

jobs:
  firmware:
    name: Generate firmware artifacts

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Compile
        run: |
          for T in $TARGETS
          do
            apptainer run $SIF make $T
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sa8x8-fw-srecs
          path: |
            ${{github.workspace}}/sa8x8-fw-*.s37

